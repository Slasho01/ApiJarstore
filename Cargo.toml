[package]
name = "jarstoreapi"
version = "0.4.0"
edition = "2021"

[dependencies]
actix-web = "4.11.0"
actix-cors = "0.7"
actix-files = "0.6"
actix-multipart = "0.7"
bcrypt = "0.17"
chrono = { version = "0.4.41", features = ["serde"] }
diesel = { version = "2.2.10", features = ["postgres", "uuid", "chrono", "r2d2", "serde_json"] }
diesel_migrations = { version = "2.2.0", features = ["postgres"] }
dotenvy = "0.15.6"
env_logger = "0.11"
futures-util = "0.3"
hmac = "0.12"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
jsonwebtoken = "9.3.1"
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "smtp-transport", "pool", "rustls-tls"] }
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "blocking"] }
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.140"
sha1 = "0.10"
sha2 = "0.10"
webp = "0.3"
uuid = { version = "1.16.0", features = ["v4", "fast-rng", "serde"] }
